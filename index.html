<div class="scrim" id="scrim"></div>
<aside id="cart">
<div class="ah"><h3>Savat</h3><button class="x" id="close">✕</button></div>
<div class="items" id="items"></div>
<div class="foot">
<input id="nm" placeholder="Ismingiz">
<input id="ph" type="tel" placeholder="Telefon raqamingiz">
<textarea id="ad" rows="2" placeholder="Manzil"></textarea>
<button class="buy" id="buy">Buyurtma yuborish</button>
<p class="note" id="msg"></p>
</div>
</aside>

<script>
var TG="Yusuf_R11";
var P=[
{id:1,n:"Pista",e:"🥜",f:"pista.jpg"},
{id:2,n:"Bodom",e:"🌰",f:"bodom.jpg"},
{id:3,n:"Kaju",e:"🥜",f:"kaju.jpg"},
{id:4,n:"Pekan yong'og'i",e:"🌰",f:"pekan.jpg"}
];
var qty={},cart={};
function $(i){return document.getElementById(i)}
function kg(v){return (Math.round(v*10)/10).toString().replace(".",",")+" kg"}
function nm(id){return P.filter(function(p){return p.id==id})[0].n}
P.forEach(function(p){qty[p.id]=1});
$("grid").innerHTML=P.map(function(p){
return '<article class="card"><div class="img">'+p.e+'<img src="'+p.f+'" alt="'+p.n+'" onerror="this.style.display=\'none\'"></div><div class="info"><div class="name">'+p.n+'</div><div class="kg"><button data-d="-'+p.id+'">−</button><output id="o'+p.id+'">1 kg</output><button data-d="'+p.id+'">+</button></div><button class="add" data-a="'+p.id+'">Savatga</button></div></article>'}).join("");
function renderCart(){
var ids=Object.keys(cart);
$("items").innerHTML=ids.length?ids.map(function(id){return '<div class="row"><span>'+nm(id)+'</span><b>'+kg(cart[id])+'</b><button data-r="'+id+'">Olib tashlash</button></div>'}).join(""):'<p class="empty">Savat bo\'sh. Mahsulot qo\'shing.</p>';
$("cnt").textContent=ids.length}
function toggle(on){$("cart").classList.toggle("on",on);$("scrim").classList.toggle("on",on)}
$("grid").onclick=function(e){
var d=e.target.getAttribute("data-d"),a=e.target.getAttribute("data-a");
if(d){var id=Math.abs(d);qty[id]=Math.max(.5,qty[id]+(d[0]==="-"?-.5:.5));$("o"+id).textContent=kg(qty[id])}
if(a){cart[a]=(cart[a]||0)+qty[a];renderCart();e.target.textContent="Qo'shildi ✓";setTimeout(function(){e.target.textContent="Savatga"},900)}};
$("items").onclick=function(e){var r=e.target.getAttribute("data-r");if(r){delete cart[r];renderCart()}};
$("open").onclick=function(){toggle(true)};
$("close").onclick=$("scrim").onclick=function(){toggle(false)};
$("buy").onclick=function(){
var ids=Object.keys(cart),m=$("msg");
if(!ids.length){m.textContent="Avval savatga mahsulot qo'shing.";return}
if(!$("nm").value.trim()||!$("ph").value.trim()){m.textContent="Ism va telefon raqamingizni yozing.";return}
var t="Yangi buyurtma\n"+ids.map(function(i){return nm(i)+": "+kg(cart[i])}).join("\n")+"\n\nIsm: "+$("nm").value.trim()+"\nTelefon: "+$("ph").value.trim()+"\nManzil: "+($("ad").value.trim()||"—");
var u="https://t.me/"+TG+"?text="+encodeURIComponent(t);
window.open(u,"_blank","noopener");
m.innerHTML='Telegram ochilmasa, shu yerni bosing: <a href="'+u+'" target="_blank" rel="noopener">Telegramda yuborish</a>'};
renderCart();
</script>
</body>
</html>
