<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bozorcha — quruq mevalar va yong'oqlar</title>
<style>
:root{--bg:#faf6ef;--s:#fff;--t:#2b2118;--m:#7a6b5c;--b:#8a4b12;--a:#f0a030;--l:#eadfcf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:Georgia,serif;line-height:1.5}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
header{position:sticky;top:0;z-index:10;background:var(--s);border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.logo{font-weight:700;font-size:22px;color:var(--b)}
.cb{background:var(--b);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600}
.cb b{background:var(--a);color:var(--t);border-radius:99px;padding:1px 8px;margin-left:6px}
.hero{max-width:1100px;margin:14px auto;border-radius:18px;padding:44px 24px;background:linear-gradient(120deg,#8a4b12,#d98a3d);color:#fff}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px);line-height:1.1}
.hero p{margin:0;font-family:system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:4px 14px 24px}
.sub{color:var(--m);font-family:system-ui,sans-serif;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--s);border:1px solid var(--l);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:1;background:#f3e6d0;display:grid;place-items:center;font-size:72px;position:relative}
.img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.info{padding:12px;display:flex;flex-direction:column;gap:8px;font-family:system-ui,sans-serif}
.name{font-family:Georgia,serif;font-size:18px;font-weight:700}
.kg{display:flex;align-items:center;gap:8px}
.kg button{width:34px;height:34px;border-radius:9px;background:var(--bg);color:var(--t);font-size:18px}
.kg output{min-width:56px;text-align:center;font-weight:700}
.add{background:var(--b);color:#fff;border-radius:10px;padding:10px;font-weight:600}
.scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.scrim.on{display:block}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--s);z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;font-family:system-ui,sans-serif}
aside.on{transform:none}
.ah{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--l)}
.ah h3{margin:0}
.x{background:none;color:var(--t);font-size:22px}
.items{flex:1;overflow-y:auto;padding:6px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--l)}
.row button{background:none;color:var(--m);text-decoration:underline}
.foot{padding:12px 16px;border-top:1px solid var(--l);display:grid;gap:8px}
.foot input,.foot textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t)}
.buy{background:var(--a);color:var(--t);border-radius:12px;padding:13px;font-weight:700}
.note{color:var(--m);font-size:13px;margin:0}
.empty{color:var(--m);text-align:center;padding:30px 0}
footer{text-align:center;color:var(--m);padding:24px 14px;font-size:13px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header><div class="logo">Bozorcha</div><button class="cb" id="open">Savat<b id="cnt">0</b></button></header>
<section class="hero"><h1>Quruq mevalar va yong'oqlar</h1><p>Kilolab sotamiz. Kerakli miqdorni tanlang, buyurtma bizga yetib keladi.</p></section>
<main>
<h2>Mahsulotlar</h2>
<p class="sub">Narxlari pista 250 ming So'm Gajak 240 ming So'm</p>
<section class="grid" id="grid"></section>
</main>
<footer>Bozorcha — quruq mevalar va yong'oqlar</footer>
<div class="scrim" id="scrim"></div>
<aside id="cart">
<div class="ah"><h3>Savat</h3><button class="x" id="close">✕</button></div>
<div class="items" id="items"></div>
<div class="foot">
<input id="nm" placeholder="Ismingiz">
<input id="ph" type="tel" placeholder="Telefon raqamingiz">
<textarea id="ad" rows="2" placeholder="Manzil"></textarea>
<button class="buy" id="buy">Buyurtma yuborish</button>
<p class="note" id="msg"></p>
</div>
</aside>

<script>
const P = [
  { id: 1, n: "Pista", e: "🥜", f: "1164.jpg" },
  { id: 2, n: "Bodom", e: "🌰", f: "1165.jpg" },
  { id: 3, n: "Kaju", e: "🥜", f: "1166.jpg" },
  { id: 4, n: "Pekan yong'og'i", e: "🌰", f: "1167.jpg" }
];
function $(i){return document.getElementById(i)}
function kg(v){return (Math.round(v*10)/10).toString().replace(".",",")+" kg"}
function pname(id){return P.filter(function(p){return p.id==id})[0].n}
P.forEach(function(p){qty[p.id]=1});
$("grid").innerHTML=P.map(function(p){
return '<article class="card"><div class="img">'+p.e+'<img src="'+p.f+'" alt="'+p.n+'" onerror="this.style.display=\'none\'"></div><div class="info"><div class="name">'+p.n+'</div><div class="kg"><button data-d="-'+p.id+'">−</button><output id="o'+p.id+'">1 kg</output><button data-d="'+p.id+'">+</button></div><button class="add" data-a="'+p.id+'">Savatga</button></div></article>'}).join("");
function renderCart(){
var ids=Object.keys(cart);
$("items").innerHTML=ids.length?ids.map(function(id){return '<div class="row"><span>'+pname(id)+'</span><b>'+kg(cart[id])+'</b><button data-r="'+id+'">Olib tashlash</button></div>'}).join(""):'<p class="empty">Savat bo\'sh. Mahsulot qo\'shing.</p>';
$("cnt").textContent=ids.length}
function toggle(on){$("cart").classList.toggle("on",on);$("scrim").classList.toggle("on",on)}
$("grid").onclick=function(e){
var d=e.target.getAttribute("data-d"),a=e.target.getAttribute("data-a");
if(d){var id=Math.abs(d);qty[id]=Math.max(.5,qty[id]+(d.charAt(0)==="-"?-.5:.5));$("o"+id).textContent=kg(qty[id])}
if(a){cart[a]=(cart[a]||0)+qty[a];renderCart();e.target.textContent="Qo'shildi ✓";setTimeout(function(){e.target.textContent="Savatga"},900)}};
$("items").onclick=function(e){var r=e.target.getAttribute("data-r");if(r){delete cart[r];renderCart()}};
$("open").onclick=function(){toggle(true)};
$("close").onclick=function(){toggle(false)};
$("scrim").onclick=function(){toggle(false)};
$("buy").onclick=function(){
var ids=Object.keys(cart),m=$("msg");
if(!ids.length){m.textContent="Avval savatga mahsulot qo'shing.";return}
if(!$("nm").value.trim()||!$("ph").value.trim()){m.textContent="Ism va telefon raqamingizni yozing.";return}
var t="Yangi buyurtma\n"+ids.map(function(i){return pname(i)+": "+kg(cart[i])}).join("\n")+"\n\nIsm: "+$("nm").value.trim()+"\nTelefon: "+$("ph").value.trim()+"\nManzil: "+($("ad").value.trim()||"—");
var u="https://t.me/"+TG+"?text="+encodeURIComponent(t);
window.open(u,"_blank","noopener");
m.innerHTML='Telegram ochilmasa, shu yerni bosing: <a href="'+u+'" target="_blank" rel="noopener">Telegramda yuborish</a>'};
renderCart();
</script>
</body>
</html>
